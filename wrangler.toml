# Cloudflare Worker 部署配置（官方 wrangler 读取）
# 自动部署：push feedback-worker.js 或本文件 → GitHub Actions 调 wrangler deploy
# 首次手动部署后，KV 的 namespace id 填到下面（dash.cloudflare.com → Workers KV → fbk 的 ID 列）

name = "feedback"
main = "feedback-worker.js"
compatibility_date = "2026-10-01"

[[kv_namespaces]]
binding = "FBK"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
